[package]
name = "ohos-native-display-soloist-sys"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Raw bindings to the OpenHarmony NativeDisplaySoloist API"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi", "graphics", "display"]
readme = "README.md"

[dependencies]
document-features = { version = "0.2", optional = true }

[features]
default = []
## Enables the NativeDisplaySoloist API. Available since OpenHarmony API level 12.
api-12 = []
api-13 = ["api-12"]
api-14 = ["api-13"]
api-15 = ["api-14"]
api-16 = ["api-15"]
api-17 = ["api-16"]
api-18 = ["api-17"]
api-19 = ["api-18"]
api-20 = ["api-19"]
api-21 = ["api-20"]
api-22 = ["api-21"]
api-23 = ["api-22"]
## Enables OpenHarmony API level 24 (no new DisplaySoloist APIs).
api-24 = ["api-23"]
## Enables OpenHarmony API level 25 (no new DisplaySoloist APIs).
api-25 = ["api-24"]
## Enables OpenHarmony API level 26 (no new DisplaySoloist APIs).
api-26 = ["api-25"]
## Document available features when building the documentation
document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["document-features"]
targets = ["aarch64-unknown-linux-ohos", "armv7-unknown-linux-ohos", "x86_64-unknown-linux-ohos"]
all-features = true
